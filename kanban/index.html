<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IT PMO – Project Board</title>
<style>
/* ==========================================================
   DESIGN TOKENS – flat, accessible slate + blue system
   (guided by the ui-ux-pro-max skill: contrast >= 4.5:1,
   status never shown by colour alone, 40px+ touch targets)
   ========================================================== */
:root {
  --bg: #f1f5f9;
  --surface: #ffffff;
  --ink: #0f172a;
  --ink-2: #334155;
  --muted: #64748b;
  --line: #e2e8f0;
  --line-strong: #cbd5e1;

  --brand: #0b2f5e;
  --accent: #1d4ed8;
  --accent-dark: #1e40af;
  --accent-soft: #dbeafe;

  --st-backlog: #475569;
  --st-progress: #1d4ed8;
  --st-blocked: #b91c1c;
  --st-done: #15803d;

  --prio-critical: #b91c1c;
  --prio-high: #b45309;
  --prio-medium: #1d4ed8;
  --prio-low: #475569;

  --danger: #b91c1c;
  --danger-bg: #fee2e2;
  --ok: #166534;
  --ok-bg: #dcfce7;
  --warn: #92400e;
  --warn-bg: #fef3c7;

  --sp-1: 0.25rem;
  --sp-2: 0.5rem;
  --sp-3: 0.75rem;
  --sp-4: 1rem;
  --sp-5: 1.5rem;
  --sp-6: 2rem;

  --radius: 10px;
  --radius-lg: 16px;
  --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.06);
  --shadow-md: 0 4px 14px rgba(15, 23, 42, 0.1);
  --ease: 160ms ease;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", Consolas, monospace;
}

/* ==========================================================
   BASE
   ========================================================== */
*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0;
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.5;
  color: var(--ink);
  background: var(--bg);
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.icon { width: 1em; height: 1em; flex: none; vertical-align: -0.125em; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.skip-link { position: absolute; left: -9999px; top: 0; background: var(--brand); color: #fff; padding: var(--sp-3) var(--sp-4); z-index: 200; }
.skip-link:focus { left: var(--sp-4); top: var(--sp-4); }

/* ==========================================================
   TOP BAR
   ========================================================== */
.app-header {
  position: sticky;
  top: 0;
  z-index: 40;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
  padding: var(--sp-3) var(--sp-5);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: var(--sp-3) var(--sp-4);
}
.wordmark {
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  margin: 0;
  font-size: 1.2rem;
  font-weight: 800;
  letter-spacing: 0.02em;
  color: var(--brand);
}
.wordmark .mark { width: 2.25rem; height: 2.25rem; flex: none; }
.wordmark span { display: block; font-size: 0.8rem; font-weight: 500; color: var(--muted); letter-spacing: 0; line-height: 1.1; }
.header-actions { display: flex; align-items: center; gap: var(--sp-4); flex-wrap: wrap; }
.reset-note {
  margin: 0;
  display: inline-flex;
  align-items: center;
  gap: var(--sp-2);
  max-width: 22rem;
  font-size: 0.78rem;
  color: var(--ink-2);
  background: var(--warn-bg);
  border-radius: 999px;
  padding: var(--sp-1) var(--sp-3);
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--sp-2);
  min-height: 44px;
  padding: 0 var(--sp-4);
  border: 1.5px solid transparent;
  border-radius: var(--radius);
  font-weight: 600;
  transition: background var(--ease), border-color var(--ease), transform var(--ease);
}
.btn:active { transform: translateY(1px); }
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover { background: var(--accent-dark); }
.btn-primary:disabled { background: var(--muted); cursor: wait; }
.btn-secondary { background: var(--surface); color: var(--ink); border-color: var(--line-strong); }
.btn-secondary:hover { background: var(--bg); border-color: var(--muted); }

/* ==========================================================
   KPI SUMMARY
   ========================================================== */
.kpis {
  display: grid;
  grid-template-columns: repeat(6, minmax(0, 1fr));
  gap: var(--sp-3);
  margin: 0;
  padding: var(--sp-5) var(--sp-5) 0;
  list-style: none;
}
.kpis li {
  background: var(--surface);
  border: 1px solid var(--line);
  border-top: 4px solid var(--line-strong);
  border-radius: var(--radius);
  padding: var(--sp-3) var(--sp-4);
  box-shadow: var(--shadow-sm);
  font-size: 0.82rem;
  font-weight: 600;
  color: var(--ink-2);
  display: flex;
  flex-direction: column-reverse;
}
.kpis strong { font-size: 1.75rem; line-height: 1.1; color: var(--ink); font-weight: 800; }
.kpis li:nth-child(1) { border-top-color: var(--brand); }
.kpis li:nth-child(2) { border-top-color: var(--st-backlog); }
.kpis li:nth-child(3) { border-top-color: var(--st-progress); }
.kpis li:nth-child(4) { border-top-color: var(--st-blocked); }
.kpis li:nth-child(5) { border-top-color: var(--st-done); }
.kpis li.stat-overdue { border-top-color: var(--danger); background: var(--danger-bg); color: var(--danger); }
.kpis li.stat-overdue strong { color: var(--danger); }

/* ==========================================================
   FILTER BAR
   ========================================================== */
.filters {
  margin: var(--sp-4) var(--sp-5) 0;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow-sm);
  padding: var(--sp-3) var(--sp-4);
  display: flex;
  flex-wrap: wrap;
  gap: var(--sp-3) var(--sp-4);
  align-items: flex-end;
}
.filters .field { display: flex; flex-direction: column; gap: var(--sp-1); }
.filters label { font-size: 0.72rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
.filters input, .filters select {
  min-height: 44px;
  min-width: 11rem;
  padding: 0 var(--sp-3);
  border: 1.5px solid var(--line-strong);
  border-radius: var(--radius);
  background: var(--surface);
  transition: border-color var(--ease), box-shadow var(--ease);
}
.filters input:hover, .filters select:hover { border-color: var(--muted); }
.filters input:focus-visible, .filters select:focus-visible { outline: none; border-color: var(--accent); box-shadow: 0 0 0 4px rgba(29, 78, 216, 0.2); }

/* ==========================================================
   BOARD + COLUMNS
   ========================================================== */
.board {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: var(--sp-4);
  padding: var(--sp-4) var(--sp-5) var(--sp-6);
  align-items: start;
}
.column {
  --col: var(--st-backlog);
  background: #e6ecf3;
  border: 2px solid transparent;
  border-top: 4px solid var(--col);
  border-radius: var(--radius-lg);
  padding: var(--sp-3);
  min-height: 12rem;
  transition: background var(--ease), border-color var(--ease);
}
.column.col-in-progress { --col: var(--st-progress); }
.column.col-blocked { --col: var(--st-blocked); }
.column.col-done { --col: var(--st-done); }
.column.drop-target {
  background: var(--accent-soft);
  border-color: var(--accent);
  border-style: dashed;
  border-top-style: dashed;
}
.column-header { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--sp-2); margin: var(--sp-1) var(--sp-1) var(--sp-3); }
.column-title { margin: 0; display: flex; align-items: flex-start; gap: var(--sp-2); font-size: 1rem; color: var(--ink); line-height: 1.25; }
.column-title .icon { color: var(--col); width: 1.25rem; height: 1.25rem; margin-top: 1px; }
.column-sub { display: block; font-size: 0.74rem; color: var(--ink-2); font-weight: 400; margin-top: 2px; }
.count-badge {
  background: var(--col);
  color: #fff;
  border-radius: 999px;
  min-width: 1.75rem;
  height: 1.75rem;
  display: grid;
  place-items: center;
  padding: 0 var(--sp-2);
  font-size: 0.8rem;
  font-weight: 700;
  flex: none;
}
.card-list { display: flex; flex-direction: column; gap: var(--sp-3); min-height: 3rem; }
.empty-col { color: var(--muted); font-size: 0.85rem; text-align: center; padding: var(--sp-5) var(--sp-3); margin: 0; border: 2px dashed var(--line-strong); border-radius: var(--radius); }

/* ==========================================================
   CARDS
   ========================================================== */
.card {
  --prio: var(--prio-medium);
  position: relative;
  background: var(--surface);
  border: 1px solid var(--line);
  border-left: 5px solid var(--prio);
  border-radius: var(--radius);
  box-shadow: var(--shadow-sm);
  padding: var(--sp-3) var(--sp-3) var(--sp-3) var(--sp-4);
  cursor: grab;
  display: flex;
  flex-direction: column;
  gap: var(--sp-2);
  transition: box-shadow var(--ease), transform var(--ease), border-color var(--ease);
}
.card:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); }
.card:active { cursor: grabbing; }
.card.dragging { opacity: 0.45; transform: rotate(1.5deg); }
.card.prio-critical { --prio: var(--prio-critical); }
.card.prio-high { --prio: var(--prio-high); }
.card.prio-medium { --prio: var(--prio-medium); }
.card.prio-low { --prio: var(--prio-low); }

.card-top { display: flex; justify-content: space-between; align-items: center; gap: var(--sp-2); }
.card-id { display: inline-flex; align-items: center; gap: var(--sp-1); font-size: 0.72rem; font-weight: 700; color: var(--muted); font-family: var(--mono); letter-spacing: 0.02em; }
.card-id .icon { color: var(--line-strong); }
.card-title { margin: 0; font-size: 0.98rem; font-weight: 650; line-height: 1.35; word-break: break-word; color: var(--ink); }
.card-meta { list-style: none; margin: 0; padding: 0; font-size: 0.82rem; color: var(--ink-2); display: flex; flex-direction: column; gap: 3px; }
.card-meta li { display: flex; align-items: center; gap: var(--sp-2); }
.card-meta .icon { color: var(--muted); }
.card-meta .project { font-weight: 600; color: var(--accent-dark); }
.card-row { display: flex; flex-wrap: wrap; gap: var(--sp-2); align-items: center; }

.pill, .tag, .overdue-badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  border-radius: 999px;
  font-size: 0.72rem;
  font-weight: 700;
  padding: 2px var(--sp-2);
  border: 1px solid transparent;
  line-height: 1.4;
}
.pill::before { font-size: 0.65rem; }
.pill-critical { background: var(--danger-bg); color: var(--prio-critical); border-color: #fca5a5; }
.pill-critical::before { content: "\25B2\25B2"; }
.pill-high { background: var(--warn-bg); color: var(--warn); border-color: #fcd34d; }
.pill-high::before { content: "\25B2"; }
.pill-medium { background: var(--accent-soft); color: var(--accent-dark); border-color: #93c5fd; }
.pill-medium::before { content: "\25C6"; }
.pill-low { background: #f1f5f9; color: var(--prio-low); border-color: var(--line-strong); }
.pill-low::before { content: "\25BC"; }
.tag { background: #f1f5f9; color: var(--ink-2); border-color: var(--line); font-weight: 600; }
.overdue-badge { background: var(--danger); color: #fff; }

.card-actions { display: flex; flex-wrap: wrap; gap: var(--sp-2); align-items: center; border-top: 1px solid var(--line); padding-top: var(--sp-2); }
.mini-btn {
  display: inline-flex;
  align-items: center;
  gap: var(--sp-1);
  min-height: 36px;
  background: var(--surface);
  border: 1.5px solid var(--line-strong);
  border-radius: 8px;
  padding: 0 var(--sp-3);
  font-size: 0.8rem;
  font-weight: 600;
  color: var(--ink-2);
  transition: background var(--ease), border-color var(--ease), color var(--ease);
}
.mini-btn:hover { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-dark); }
.mini-btn.danger { background: var(--danger); border-color: var(--danger); color: #fff; }
.mini-btn.danger:hover { background: #991b1b; }
.icon-btn {
  display: grid;
  place-items: center;
  width: 36px;
  height: 36px;
  margin: -6px -6px -6px 0;
  border: none;
  background: transparent;
  color: var(--muted);
  border-radius: 8px;
  transition: background var(--ease), color var(--ease);
}
.icon-btn:hover { background: var(--danger-bg); color: var(--danger); }
.icon-btn .icon { width: 1.1rem; height: 1.1rem; }
.confirm-delete { display: flex; flex-wrap: wrap; gap: var(--sp-2); align-items: center; font-size: 0.85rem; font-weight: 600; color: var(--danger); }
.move-menu { display: flex; flex-wrap: wrap; gap: var(--sp-2); }

/* ==========================================================
   MODAL + FORM
   ========================================================== */
.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(15, 23, 42, 0.55);
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding: var(--sp-5);
  overflow-y: auto;
  z-index: 60;
}
.modal-backdrop[hidden] { display: none; }
.modal {
  background: var(--surface);
  border-radius: var(--radius-lg);
  width: 100%;
  max-width: 38rem;
  padding: var(--sp-5) var(--sp-5) var(--sp-4);
  box-shadow: 0 24px 60px rgba(15, 23, 42, 0.35);
}
.modal h2 { margin: 0 0 var(--sp-1); font-size: 1.35rem; color: var(--ink); }
.modal-sub { margin: 0 0 var(--sp-4); color: var(--muted); font-size: 0.88rem; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-3) var(--sp-4); }
.form-field { display: flex; flex-direction: column; gap: var(--sp-1); }
.form-field.full { grid-column: 1 / -1; }
.form-field label { font-weight: 600; font-size: 0.85rem; color: var(--ink); }
.form-field input, .form-field select, .form-field textarea {
  min-height: 44px;
  padding: var(--sp-2) var(--sp-3);
  border: 1.5px solid var(--line-strong);
  border-radius: var(--radius);
  background: var(--surface);
  width: 100%;
  transition: border-color var(--ease), box-shadow var(--ease);
}
.form-field input:hover, .form-field select:hover, .form-field textarea:hover { border-color: var(--muted); }
.form-field input:focus-visible, .form-field select:focus-visible, .form-field textarea:focus-visible { outline: none; border-color: var(--accent); box-shadow: 0 0 0 4px rgba(29, 78, 216, 0.2); }
.form-field textarea { resize: vertical; min-height: 5.5rem; }
.form-field.invalid input, .form-field.invalid select, .form-field.invalid textarea { border-color: var(--danger); }
.field-error { color: var(--danger); font-size: 0.82rem; font-weight: 500; margin: 0; }
.field-hint { color: var(--muted); font-size: 0.76rem; }
.form-actions { display: flex; justify-content: flex-end; gap: var(--sp-3); margin-top: var(--sp-5); padding-top: var(--sp-4); border-top: 1px solid var(--line); }

/* ==========================================================
   TOASTS
   ========================================================== */
.toast-region {
  position: fixed;
  bottom: var(--sp-4);
  right: var(--sp-4);
  display: flex;
  flex-direction: column;
  gap: var(--sp-2);
  z-index: 100;
  max-width: calc(100vw - 2rem);
}
.toast {
  display: flex;
  gap: var(--sp-3);
  align-items: flex-start;
  padding: var(--sp-3) var(--sp-4);
  border-radius: var(--radius);
  box-shadow: var(--shadow-md);
  border-left: 5px solid;
  font-size: 0.9rem;
  font-weight: 500;
  background: var(--surface);
  animation: toast-in 200ms ease;
}
.toast::before { font-weight: 800; }
.toast-success { background: var(--ok-bg); color: var(--ok); border-color: var(--ok); }
.toast-success::before { content: "\2713"; }
.toast-warning { background: var(--warn-bg); color: var(--warn); border-color: var(--prio-high); }
.toast-warning::before { content: "!"; }
@keyframes toast-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

/* ==========================================================
   RESPONSIVE – stack columns below 768px
   ========================================================== */
@media (max-width: 1100px) {
  .board { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}
@media (max-width: 767px) {
  .board { grid-template-columns: 1fr; padding: var(--sp-3) var(--sp-3) var(--sp-5); }
  .app-header { padding-left: var(--sp-3); padding-right: var(--sp-3); }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); padding: var(--sp-3) var(--sp-3) 0; }
  .filters { margin: var(--sp-3) var(--sp-3) 0; }
  .filters .field, .filters input, .filters select { width: 100%; }
  .form-grid { grid-template-columns: 1fr; }
  .reset-note { max-width: none; }
  .modal-backdrop { padding: var(--sp-3); }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none; animation: none; }
  .card:hover, .card.dragging { transform: none; }
}
</style>
</head>
<body>

<!-- ============ HEADER: wordmark, live summary, add button ============ -->
<a class="skip-link" href="#board">Skip to board</a>
<header class="app-header">
  <h1 class="wordmark">
    <svg class="mark" viewBox="0 0 36 36" aria-hidden="true"><rect width="36" height="36" rx="9" fill="#0b2f5e"/><rect x="7" y="8" width="6" height="20" rx="2" fill="#93c5fd"/><rect x="15" y="8" width="6" height="13" rx="2" fill="#fff"/><rect x="23" y="8" width="6" height="16" rx="2" fill="#60a5fa"/></svg>
    <div>IT PMO<span>Project Board</span></div>
  </h1>
  <div class="header-actions">
    <a class="btn btn-secondary" href="../">Northbeam site</a>
    <p class="reset-note"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16.5v.01"/></svg>Demo only – board lives in memory and resets to sample data on refresh.</p>
    <button type="button" class="btn btn-primary" id="open-form"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Add Task</button>
  </div>
</header>

<!-- ============ LIVE SUMMARY (rendered by renderSummary) ============ -->
<ul class="kpis" id="summary" aria-label="Board summary"></ul>

<!-- ============ FILTER BAR ============ -->
<section class="filters" aria-label="Filters">
  <div class="field">
    <label for="filter-project">Project</label>
    <select id="filter-project"></select>
  </div>
  <div class="field">
    <label for="filter-assignee">Assignee contains</label>
    <input type="text" id="filter-assignee" placeholder="e.g. Tan" autocomplete="off">
  </div>
  <div class="field">
    <label for="filter-priority">Priority</label>
    <select id="filter-priority"></select>
  </div>
  <button type="button" class="btn btn-secondary" id="clear-filters">Clear filters</button>
</section>

<!-- ============ KANBAN BOARD (columns rendered by renderBoard) ============ -->
<main class="board" id="board" aria-label="Kanban board"></main>

<!-- ============ ADD TASK MODAL ============ -->
<div class="modal-backdrop" id="modal" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <h2 id="modal-title">Add Task</h2>
    <p class="modal-sub">Fields marked * are required.</p>
    <form id="task-form" novalidate>
      <div class="form-grid">
        <div class="form-field full">
          <label for="f-title">Task Title *</label>
          <input type="text" id="f-title" name="title" maxlength="200" aria-describedby="e-title">
          <p class="field-error" id="e-title" role="alert"></p>
        </div>
        <div class="form-field full">
          <label for="f-description">Description</label>
          <textarea id="f-description" name="description" aria-describedby="e-description"></textarea>
          <span class="field-hint">Optional, max 500 characters.</span>
          <p class="field-error" id="e-description" role="alert"></p>
        </div>
        <div class="form-field">
          <label for="f-project">Project / Workstream</label>
          <select id="f-project" name="project"></select>
        </div>
        <div class="form-field">
          <label for="f-category">Category</label>
          <select id="f-category" name="category"></select>
        </div>
        <div class="form-field">
          <label for="f-assignee">Assignee *</label>
          <input type="text" id="f-assignee" name="assignee" aria-describedby="e-assignee">
          <p class="field-error" id="e-assignee" role="alert"></p>
        </div>
        <div class="form-field">
          <label for="f-priority">Priority</label>
          <select id="f-priority" name="priority"></select>
        </div>
        <div class="form-field">
          <label for="f-due">Due Date *</label>
          <input type="date" id="f-due" name="dueDate" aria-describedby="e-due">
          <p class="field-error" id="e-due" role="alert"></p>
        </div>
        <div class="form-field">
          <label for="f-status">Status</label>
          <select id="f-status" name="status"></select>
        </div>
      </div>
      <div class="form-actions">
        <button type="button" class="btn btn-secondary" id="cancel-form">Cancel</button>
        <button type="submit" class="btn btn-primary" id="submit-btn">Add Task</button>
      </div>
    </form>
  </div>
</div>

<!-- ============ TOAST REGION ============ -->
<div class="toast-region" id="toasts" aria-live="polite" aria-atomic="false"></div>

<script>
"use strict";

/* ==========================================================
   CONFIG
   ----------------------------------------------------------
   CHANGE THE EMAIL ADDRESS BELOW (one place only).
   ========================================================== */
/*
  FormSubmit needs a ONE-TIME ACTIVATION: the first submission sent to a new
  address triggers a confirmation email to that address. Submissions are only
  delivered after the link in that email has been clicked.
*/
const FORMSUBMIT_ENDPOINT = "https://formsubmit.co/ajax/YOUR_EMAIL@example.com";

const STATUSES = [
  { name: "Backlog",     hint: "Logged, not yet scheduled" },
  { name: "In Progress", hint: "Actively being worked" },
  { name: "Blocked",     hint: "Waiting on dependency, vendor or approval" },
  { name: "Done",        hint: "Completed / closed" }
];
const PROJECTS   = ["Core Banking Upgrade", "Digital Channels", "Cybersecurity Uplift", "Data & Analytics", "Infrastructure & Cloud", "Vendor Management"];
const CATEGORIES = ["Application Development", "Infrastructure", "Cybersecurity", "Data", "Compliance", "Vendor"];
const PRIORITIES = ["Critical", "High", "Medium", "Low"];
const TOAST_MS = 4500;

/* ==========================================================
   STATE – single source of truth (memory only, no storage APIs)
   ========================================================== */
const state = {
  tasks: [],
  filters: { project: "", assignee: "", priority: "" },
  ui: { confirmDeleteId: null, moveOpenId: null, dragId: null, submitting: false },
  counter: 0
};

/* ==========================================================
   HELPERS
   ========================================================== */
// Escape any string before it goes into HTML.
function escapeHtml(value) {
  return String(value == null ? "" : value)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

// Local-date YYYY-MM-DD, offset by N days (for "today" and seed dates).
function isoDate(offsetDays) {
  const d = new Date();
  d.setDate(d.getDate() + (offsetDays || 0));
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return d.getFullYear() + "-" + m + "-" + day;
}

function isOverdue(task) {
  return task.status !== "Done" && task.dueDate < isoDate(0);
}

function formatDate(iso) {
  const p = iso.split("-");
  const d = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
  return d.toLocaleDateString(undefined, { day: "2-digit", month: "short", year: "numeric" });
}

function formatId(n) {
  return "UOB-ITPM-" + String(n).padStart(4, "0");
}

function optionsHtml(list, placeholder) {
  const first = placeholder ? '<option value="">' + escapeHtml(placeholder) + "</option>" : "";
  return first + list.map(function (v) {
    return '<option value="' + escapeHtml(v) + '">' + escapeHtml(v) + "</option>";
  }).join("");
}

/* ==========================================================
   SEED DATA – 8 demo tasks (dates relative to today)
   ========================================================== */
function seedTasks() {
  const rows = [
    ["Migrate FX pricing service to AWS", "Infrastructure & Cloud", "Infrastructure", "Priya Nair", "High", 21, "In Progress", "Lift-and-shift of the FX pricing engine with parallel run."],
    ["Patch CVE-2025-XXXX on branch teller VDI", "Cybersecurity Uplift", "Cybersecurity", "Marcus Tan", "Critical", -2, "In Progress", "Roll out vendor patch to all branch teller VDI pools."],
    ["UAT sign-off for mobile onboarding release 4.2", "Digital Channels", "Application Development", "Sofia Lim", "High", 5, "Blocked", "Waiting on business sign-off for defect triage."],
    ["Renew core ledger vendor support contract", "Vendor Management", "Vendor", "Daniel Ong", "Medium", 30, "Backlog", "Commercial negotiation and legal review pending."],
    ["Build customer churn dashboard", "Data & Analytics", "Data", "Aisha Rahman", "Low", 45, "Backlog", "Self-service dashboard for retail relationship managers."],
    ["Complete quarterly access recertification", "Cybersecurity Uplift", "Compliance", "Kevin Wu", "Medium", -5, "Blocked", "Three application owners have not responded."],
    ["Core banking DB upgrade – dry run 2", "Core Banking Upgrade", "Infrastructure", "Helen Koh", "High", 12, "Backlog", "Second rehearsal in pre-prod with rollback test."],
    ["Decommission legacy statement printer service", "Infrastructure & Cloud", "Application Development", "Ravi Menon", "Low", -10, "Done", "Service retired and monitoring alerts removed."]
  ];
  return rows.map(function (r) {
    state.counter += 1;
    return {
      id: formatId(state.counter), title: r[0], project: r[1], category: r[2],
      assignee: r[3], priority: r[4], dueDate: isoDate(r[5]), status: r[6], description: r[7]
    };
  });
}

/* ==========================================================
   FILTERING – pure client-side over state.tasks
   ========================================================== */
function applyFilters() {
  const f = state.filters;
  const needle = f.assignee.trim().toLowerCase();
  return state.tasks.filter(function (t) {
    return (!f.project || t.project === f.project) &&
           (!f.priority || t.priority === f.priority) &&
           (!needle || t.assignee.toLowerCase().indexOf(needle) !== -1);
  });
}

/* ==========================================================
   RENDERING – all card DOM is produced here, from state
   ========================================================== */
// Inline SVG icons (no emoji, no external files). All are decorative: aria-hidden.
const ICON_PATHS = {
  user: '<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/>',
  calendar: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  grip: '<circle cx="9" cy="6" r="1.2"/><circle cx="15" cy="6" r="1.2"/><circle cx="9" cy="12" r="1.2"/><circle cx="15" cy="12" r="1.2"/><circle cx="9" cy="18" r="1.2"/><circle cx="15" cy="18" r="1.2"/>',
  close: '<path d="M6 6l12 12M18 6L6 18"/>',
  move: '<path d="M5 12h14M13 6l6 6-6 6"/>',
  backlog: '<path d="M4 6h16M4 12h16M4 18h10"/>',
  progress: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/>',
  blocked: '<circle cx="12" cy="12" r="9"/><path d="M5.6 5.6l12.8 12.8"/>',
  done: '<circle cx="12" cy="12" r="9"/><path d="M8 12.5l3 3 5-6"/>'
};
function icon(name) {
  return '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" ' +
         'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + (ICON_PATHS[name] || "") + "</svg>";
}
function statusSlug(name) { return name.toLowerCase().replace(/\s+/g, "-"); }
const STATUS_ICON = { "Backlog": "backlog", "In Progress": "progress", "Blocked": "blocked", "Done": "done" };

function renderCard(task) {
  const id = escapeHtml(task.id);
  const prio = task.priority.toLowerCase();
  const overdue = isOverdue(task)
    ? '<span class="overdue-badge" title="Past due date">' + icon("clock") + "Overdue</span>" : "";

  let actions;
  if (state.ui.confirmDeleteId === task.id) {
    actions =
      '<div class="confirm-delete" role="group" aria-label="Confirm delete ' + id + '">' +
      "<span>Delete?</span>" +
      '<button type="button" class="mini-btn danger" data-action="delete-yes" data-id="' + id + '">Yes</button>' +
      '<button type="button" class="mini-btn" data-action="delete-no" data-id="' + id + '">No</button>' +
      "</div>";
  } else if (state.ui.moveOpenId === task.id) {
    actions =
      '<div class="move-menu" role="group" aria-label="Move ' + id + ' to">' +
      STATUSES.filter(function (s) { return s.name !== task.status; }).map(function (s) {
        return '<button type="button" class="mini-btn" data-action="move-to" data-id="' + id +
               '" data-status="' + escapeHtml(s.name) + '">' + escapeHtml(s.name) + "</button>";
      }).join("") +
      '<button type="button" class="mini-btn" data-action="move-close" data-id="' + id + '">Cancel</button>' +
      "</div>";
  } else {
    actions =
      '<button type="button" class="mini-btn" data-action="move-open" data-id="' + id +
      '" aria-label="Move ' + id + ' to another column">Move ' + icon("move") + "</button>";
  }

  return (
    '<article class="card prio-' + prio + '" draggable="true" data-id="' + id + '">' +
      '<div class="card-top">' +
        '<span class="card-id">' + icon("grip") + id + "</span>" +
        '<button type="button" class="icon-btn" data-action="delete-ask" data-id="' + id +
        '" aria-label="Delete task ' + id + '">' + icon("close") + "</button>" +
      "</div>" +
      '<h3 class="card-title">' + escapeHtml(task.title) + "</h3>" +
      '<ul class="card-meta">' +
        '<li class="project">' + escapeHtml(task.project) + "</li>" +
        "<li>" + icon("user") + escapeHtml(task.assignee) + "</li>" +
        "<li>" + icon("calendar") + "Due " + escapeHtml(formatDate(task.dueDate)) + "</li>" +
      "</ul>" +
      '<div class="card-row">' +
        '<span class="pill pill-' + prio + '">' + escapeHtml(task.priority) + "</span>" +
        '<span class="tag">' + escapeHtml(task.category) + "</span>" +
        overdue +
      "</div>" +
      '<div class="card-actions">' + actions + "</div>" +
    "</article>"
  );
}

function renderSummary() {
  const all = state.tasks;
  const parts = ['<li><strong>' + all.length + "</strong>Total</li>"];
  STATUSES.forEach(function (s) {
    const n = all.filter(function (t) { return t.status === s.name; }).length;
    parts.push("<li><strong>" + n + "</strong>" + escapeHtml(s.name) + "</li>");
  });
  const od = all.filter(isOverdue).length;
  parts.push('<li class="stat-overdue"><strong>' + od + "</strong>Overdue</li>");
  document.getElementById("summary").innerHTML = parts.join("");
}

function renderBoard() {
  const visible = applyFilters();
  const board = document.getElementById("board");
  board.innerHTML = STATUSES.map(function (s) {
    const cards = visible.filter(function (t) { return t.status === s.name; });
    const body = cards.length
      ? cards.map(renderCard).join("")
      : '<p class="empty-col">No tasks</p>';
    return (
      '<section class="column col-' + statusSlug(s.name) + '" data-status="' + escapeHtml(s.name) + '" aria-label="' + escapeHtml(s.name) + ' column">' +
        '<div class="column-header">' +
          '<h2 class="column-title">' + icon(STATUS_ICON[s.name]) +
            "<span>" + escapeHtml(s.name) +
            '<span class="column-sub">' + escapeHtml(s.hint) + "</span></span></h2>" +
          '<span class="count-badge" aria-label="' + cards.length + ' tasks">' + cards.length + "</span>" +
        "</div>" +
        '<div class="card-list">' + body + "</div>" +
      "</section>"
    );
  }).join("");
  renderSummary();
  restoreFocus();
}

// After a re-render, put keyboard focus somewhere sensible for inline controls.
function restoreFocus() {
  let sel = null;
  if (state.ui.confirmDeleteId) sel = '[data-action="delete-no"][data-id="' + state.ui.confirmDeleteId + '"]';
  else if (state.ui.moveOpenId) sel = '.move-menu [data-action="move-to"][data-id="' + state.ui.moveOpenId + '"]';
  if (!sel) return;
  const el = document.querySelector(sel);
  if (el) el.focus();
}

/* ==========================================================
   ACTIONS – mutate state, then re-render
   ========================================================== */
function addTask(data) {
  state.counter += 1;
  const task = {
    id: formatId(state.counter),
    title: data.title, description: data.description, project: data.project,
    category: data.category, assignee: data.assignee, priority: data.priority,
    dueDate: data.dueDate, status: data.status
  };
  state.tasks.push(task);
  renderBoard();
  return task;
}

function moveTask(id, newStatus) {
  const task = state.tasks.find(function (t) { return t.id === id; });
  const valid = STATUSES.some(function (s) { return s.name === newStatus; });
  if (!task || !valid) return;
  task.status = newStatus;
  state.ui.moveOpenId = null;
  renderBoard();
}

function deleteTask(id) {
  state.tasks = state.tasks.filter(function (t) { return t.id !== id; });
  state.ui.confirmDeleteId = null;
  renderBoard();
}

/* ==========================================================
   TOASTS
   ========================================================== */
function showToast(message, type) {
  const region = document.getElementById("toasts");
  const el = document.createElement("div");
  el.className = "toast toast-" + (type || "success");
  el.textContent = message; // textContent: safe by construction
  region.appendChild(el);
  setTimeout(function () { el.remove(); }, TOAST_MS);
}

/* ==========================================================
   FORMSUBMIT NOTIFICATION (AJAX JSON, page never navigates)
   ========================================================== */
async function notifyNewTask(task) {
  const res = await fetch(FORMSUBMIT_ENDPOINT, {
    method: "POST",
    headers: { "Content-Type": "application/json", Accept: "application/json" },
    body: JSON.stringify({
      _subject: `[IT PMO] New task ${task.id}: ${task.title}`,
      _template: "table",
      _captcha: "false",
      "Task ID": task.id,
      Title: task.title,
      Description: task.description,
      Project: task.project,
      Category: task.category,
      Assignee: task.assignee,
      Priority: task.priority,
      "Due Date": task.dueDate,
      Status: task.status,
      "Submitted At": new Date().toISOString()
    })
  });
  if (!res.ok) throw new Error(`FormSubmit failed: ${res.status}`);
  return res.json();
}

/* ==========================================================
   FORM – validation, modal handling, submit
   ========================================================== */
const form = document.getElementById("task-form");
const modal = document.getElementById("modal");
let lastFocus = null;

function setError(fieldId, errId, message) {
  const field = document.getElementById(fieldId);
  document.getElementById(errId).textContent = message || "";
  field.closest(".form-field").classList.toggle("invalid", !!message);
  field.setAttribute("aria-invalid", message ? "true" : "false");
}

function readForm() {
  const v = function (id) { return document.getElementById(id).value.trim(); };
  return {
    title: v("f-title"), description: v("f-description"), project: v("f-project"),
    category: v("f-category"), assignee: v("f-assignee"), priority: v("f-priority"),
    dueDate: v("f-due"), status: v("f-status")
  };
}

// Returns true when valid; writes inline error text for each bad field.
function validateForm(d) {
  let ok = true;
  const check = function (fieldId, errId, msg) {
    setError(fieldId, errId, msg);
    if (msg) ok = false;
  };
  check("f-title", "e-title",
    !d.title ? "Task title is required." :
    d.title.length > 80 ? "Title must be 80 characters or fewer (currently " + d.title.length + ")." : "");
  check("f-description", "e-description",
    d.description.length > 500 ? "Description must be 500 characters or fewer (currently " + d.description.length + ")." : "");
  check("f-assignee", "e-assignee", !d.assignee ? "Assignee is required." : "");
  check("f-due", "e-due",
    !d.dueDate ? "Due date is required." :
    d.dueDate < isoDate(0) ? "Due date must not be in the past." : "");
  return ok;
}

function openForm() {
  lastFocus = document.activeElement;
  form.reset();
  document.getElementById("f-priority").value = "Medium";
  document.getElementById("f-status").value = "Backlog";
  document.getElementById("f-due").min = isoDate(0);
  ["f-title:e-title", "f-description:e-description", "f-assignee:e-assignee", "f-due:e-due"].forEach(function (p) {
    const a = p.split(":");
    setError(a[0], a[1], "");
  });
  modal.hidden = false;
  document.getElementById("f-title").focus();
}

function closeForm() {
  modal.hidden = true;
  if (lastFocus && lastFocus.focus) lastFocus.focus();
}

async function handleSubmit(event) {
  event.preventDefault();
  if (state.ui.submitting) return;
  const data = readForm();
  if (!validateForm(data)) {
    const firstBad = form.querySelector(".invalid input, .invalid textarea, .invalid select");
    if (firstBad) firstBad.focus();
    return;
  }

  // Optimistic UI: card appears immediately, network call runs after.
  const task = addTask(data);
  showToast("Task " + task.id + " added to the board.", "success");

  const btn = document.getElementById("submit-btn");
  state.ui.submitting = true;
  btn.disabled = true;
  btn.textContent = "Sending…";
  try {
    await notifyNewTask(task);
  } catch (err) {
    // A FormSubmit failure must never break the board.
    showToast("Card added locally — email notification failed", "warning");
  } finally {
    state.ui.submitting = false;
    btn.disabled = false;
    btn.textContent = "Add Task";
  }
}

/* ==========================================================
   EVENTS – delegation for cards, drag & drop, filters, form
   ========================================================== */
function handleBoardClick(event) {
  const btn = event.target.closest("[data-action]");
  if (!btn) return;
  const id = btn.getAttribute("data-id");
  const action = btn.getAttribute("data-action");
  if (action === "delete-ask")  { state.ui.confirmDeleteId = id; state.ui.moveOpenId = null; renderBoard(); }
  else if (action === "delete-no") { state.ui.confirmDeleteId = null; renderBoard(); focusCard(id, "delete-ask"); }
  else if (action === "delete-yes") { deleteTask(id); }
  else if (action === "move-open")  { state.ui.moveOpenId = id; state.ui.confirmDeleteId = null; renderBoard(); }
  else if (action === "move-close") { state.ui.moveOpenId = null; renderBoard(); focusCard(id, "move-open"); }
  else if (action === "move-to")    { moveTask(id, btn.getAttribute("data-status")); focusCard(id, "move-open"); }
}

function focusCard(id, action) {
  const el = document.querySelector('[data-action="' + action + '"][data-id="' + id + '"]');
  if (el) el.focus();
}

// Native HTML5 drag and drop (delegated on the board element).
function setupDragAndDrop(board) {
  board.addEventListener("dragstart", function (e) {
    const card = e.target.closest(".card");
    if (!card) return;
    state.ui.dragId = card.getAttribute("data-id");
    e.dataTransfer.effectAllowed = "move";
    e.dataTransfer.setData("text/plain", state.ui.dragId);
    card.classList.add("dragging");
  });
  board.addEventListener("dragend", function (e) {
    state.ui.dragId = null;
    clearDropTargets();
    const card = e.target.closest(".card");
    if (card) card.classList.remove("dragging");
  });
  board.addEventListener("dragover", function (e) {
    const col = e.target.closest(".column");
    if (!col || !state.ui.dragId) return;
    e.preventDefault(); // required to allow a drop
    e.dataTransfer.dropEffect = "move";
    if (!col.classList.contains("drop-target")) {
      clearDropTargets();
      col.classList.add("drop-target");
    }
  });
  board.addEventListener("dragleave", function (e) {
    const col = e.target.closest(".column");
    if (col && !col.contains(e.relatedTarget)) col.classList.remove("drop-target");
  });
  board.addEventListener("drop", function (e) {
    const col = e.target.closest(".column");
    if (!col || !state.ui.dragId) return;
    e.preventDefault();
    const id = state.ui.dragId;
    state.ui.dragId = null;
    moveTask(id, col.getAttribute("data-status"));
  });
}

function clearDropTargets() {
  document.querySelectorAll(".column.drop-target").forEach(function (c) { c.classList.remove("drop-target"); });
}

function setupFilters() {
  const proj = document.getElementById("filter-project");
  const prio = document.getElementById("filter-priority");
  const who = document.getElementById("filter-assignee");
  proj.innerHTML = optionsHtml(PROJECTS, "All projects");
  prio.innerHTML = optionsHtml(PRIORITIES, "All priorities");
  const sync = function () {
    state.filters.project = proj.value;
    state.filters.priority = prio.value;
    state.filters.assignee = who.value;
    renderBoard();
  };
  proj.addEventListener("change", sync);
  prio.addEventListener("change", sync);
  who.addEventListener("input", sync);
  document.getElementById("clear-filters").addEventListener("click", function () {
    proj.value = ""; prio.value = ""; who.value = "";
    sync();
  });
}

function setupForm() {
  document.getElementById("f-project").innerHTML = optionsHtml(PROJECTS);
  document.getElementById("f-category").innerHTML = optionsHtml(CATEGORIES);
  document.getElementById("f-priority").innerHTML = optionsHtml(PRIORITIES);
  document.getElementById("f-status").innerHTML = optionsHtml(STATUSES.map(function (s) { return s.name; }));
  document.getElementById("open-form").addEventListener("click", openForm);
  document.getElementById("cancel-form").addEventListener("click", closeForm);
  form.addEventListener("submit", handleSubmit);
  modal.addEventListener("mousedown", function (e) { if (e.target === modal) closeForm(); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && !modal.hidden) closeForm();
  });
}

/* ==========================================================
   INIT
   ========================================================== */
function init() {
  state.tasks = seedTasks();
  const board = document.getElementById("board");
  board.addEventListener("click", handleBoardClick);
  setupDragAndDrop(board);
  setupFilters();
  setupForm();
  renderBoard();
}
init();
</script>
</body>
</html>
