name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: index.html exists
        run: test -f index.html

      - name: No browser storage APIs
        run: |
          if grep -nE 'localStorage|sessionStorage|indexedDB|document\.cookie' index.html; then
            echo "Storage APIs are not allowed"; exit 1
          fi

      - name: No !important
        run: |
          if grep -n '!important' index.html; then
            echo "!important is not allowed"; exit 1
          fi

      - name: Only the FormSubmit URL is referenced
        run: |
          if grep -oE 'https?://[^"'"'"' )<>`]+' index.html | grep -v '^https://formsubmit.co/ajax/'; then
            echo "Unexpected external URL"; exit 1
          fi

      - name: No real email in the endpoint
        run: |
          grep -q 'YOUR_EMAIL@example.com' index.html || { echo "FORMSUBMIT_ENDPOINT must keep the placeholder in the repo"; exit 1; }
